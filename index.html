<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>CyberMentor — Cybersecurity Tutor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #0a0f1b 0%, #1e293b 100%);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .chat-container {
    width: 100%;
    max-width: 700px;
    height: 90vh;
    background: #1e293b;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid #334155;
  }
  .header {
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: white;
    padding: 20px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header-icon { font-size: 28px; }
  .header h1 { font-size: 18px; font-weight: 600; }
  .header p { font-size: 13px; opacity: 0.9; }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .message {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 14px;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .user {
    align-self: flex-end;
    background: #25eb71;
    color: #0a0f1b;
    border-bottom-right-radius: 4px;
  }
  .bot {
    align-self: flex-start;
    background: #111111;
    color: #e2e8f0;
    border-bottom-left-radius: 4px;
  }
  .typing {
    align-self: flex-start;
    color: #94a3b8;
    font-style: italic;
    font-size: 13px;
    padding: 4px 8px;
  }
  .input-area {
    display: flex;
    gap: 10px;
    padding: 16px;
    background: #0f172a;
    border-top: 1px solid #334155;
  }
  #userInput {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid #334155;
    border-radius: 10px;
    background: #1e293b;
    color: #e2e8f0;
    font-size: 14px;
    outline: none;
  }
  #userInput:focus { border-color: #2563eb; }
  #sendBtn {
    padding: 12px 24px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
  }
  #sendBtn:hover { background: #1d4ed8; }
  #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
  <div class="chat-container">
    <div class="header">
      <div class="header-icon">🔒</div>
      <div>
        <h1>CyberMentor</h1>
        <p>Your Cybersecurity Learning Assistant</p>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="message bot">
        Hi! I'm CyberMentor 👋 Ask me anything about cybersecurity, ethical hacking, or networking fundamentals.
      </div>
    </div>

    <div class="input-area">
      <input id="userInput" type="text" placeholder="Ask a cybersecurity question..." autofocus />
      <button id="sendBtn">Send</button>
    </div>
  </div>

<script>
  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");

  function addMessage(text, who) {
    const div = document.createElement("div");
    div.className = "message " + who;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    addMessage(text, "user");
    inputEl.value = "";
    sendBtn.disabled = true;

    const typingEl = document.createElement("div");
    typingEl.className = "typing";
    typingEl.textContent = "CyberMentor is thinking...";
    messagesEl.appendChild(typingEl);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    try {
      const response = await fetch("/chat", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({
    userId: "demo-student-001",     // hardcoded for now; real userId comes in Phase 3
    query: text,
    metadata: {
      courseId: "CYBER101",
      chapterId: "MOD6"
    }
  })
});
const data = await response.json();
typingEl.remove();
addMessage(data.assistantMessage.text, "bot");
    } catch (err) {
      typingEl.remove();
      addMessage("⚠️ Sorry, I couldn't reach the server. Please try again.", "bot");
    }

    sendBtn.disabled = false;
    inputEl.focus();
  }

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keypress", (e) => {
    if (e.key === "Enter") sendMessage();
  });
</script>
</body>
</html>
